<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="title desc">
  <title>micronotes</title>
  <desc>A lowercase n in two tones on a dark rounded plate.</desc>

  <!--
    A sibling of ../microide's icon, and built to the same drawing on purpose:
    the same rounded plate at the same radius, the same thin outline around it,
    the same 2.5-unit round-capped stroke, the same x-height, and a letter made
    of a stem with a quarter-round shoulder springing off it. An m is three of
    those units and an n is one, so this mark is the narrower of the two, which
    is what the two letters do anyway and is the point of a family.

    (An XML comment cannot carry a double hyphen, hence the em dashes here
    where the rest of the tree writes two of them.)

    The plate is the app's own darkest surface with the app's own rule around
    it — `editorBackground` over `border` from src/ui/Theme.cpp — so the icon
    is the colour of the window it opens rather than a second palette to keep
    in step.
  -->
  <rect x="1" y="1" width="30" height="30" rx="8" fill="#0F131B" stroke="#2A3548"/>

  <!--
    The letter in two tones, cut at the crest where the stem's half of it ends
    and the shoulder's half begins: half the drawn length each way, which is
    the balance the m's two colours are cut at.

    The second path starts at 17.25 rather than at the 16 where the colours
    actually change, because a round cap reaches back half the stroke width,
    1.25 units here. Written to change at 16, that cap would have carried the
    second tone back to 14.75 and put the seam a stroke's width left of the
    crest.

    Both tones are the palette's own: `accent` for the stem, and the hue beside
    it that stays apart from it at sixteen pixels, which is the teal a `[!TIP]`
    callout takes, for the shoulder.
  -->
  <path d="M12 21.5V13Q12 11.5 13.5 11.5H17.25" fill="none" stroke="#729ED8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M17.25 11.5H18.5Q20 11.5 20 13V21.5" fill="none" stroke="#8ED4E6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
